<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng thẻ hình ảnh trong HTML</title>
</head>
<body>

    <h1>Hình ảnh yêu thích của tôi</h1>

    <!-- 
      - Thuộc tính src: Đường dẫn tới tệp ảnh (đường dẫn online hoặc tên file ảnh trong cùng thư mục).
      - Thuộc tính alt: Đoạn văn bản văn mô tả hình ảnh (xuất hiện khi ảnh bị lỗi hoặc dùng cho trình đọc màn hình).
      - Thuộc tính width/height (tùy chọn): Chỉnh kích thước hiển thị của ảnh.
    -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRB2iqfeogEe1cOysgEFf264t8HRJqOTrZFUVngh8ZVpw&s=10" alt="Hình ảnh minh họa" width="400">

</body>
</html>
